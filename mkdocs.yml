site_name: Tapo Robot Vacuum for Home Assistant
site_url: https://epg-pers.github.io/tapo-rv30-ha/
site_description: Local-only Home Assistant integration for TP-Link Tapo robot vacuums (RV20, RV30, RV30C, RV50) with a live map card, a sidebar page, schedules editor and remote drive. No cloud.
repo_url: https://github.com/epg-pers/tapo-rv30-ha
repo_name: epg-pers/tapo-rv30-ha
edit_uri: edit/main/docs/
docs_dir: docs
# Pages are listed in nav below; a new page needs a line there. The changelog and
# contributing pages include the repository's own files, so they never go stale.

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/epg-pers/tapo-rv30-ha
    - icon: material/home-assistant
      link: https://my.home-assistant.io/redirect/hacs_repository/?owner=epg-pers&repository=tapo-rv30-ha&category=integration

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - The sidebar page: panel.md
  - The planner: planner.md
  - The card and dashboards: card.md
  - Voice and automations: automations.md
  - Entities: entities.md
  - Services and events: services.md
  - Matter: matter.md
  - Map backup and recovery: map-recovery.md
  - Troubleshooting: troubleshooting.md
  - Protocol notes: protocol.md
  - Changelog: changelog.md
  - Contributing: contributing.md
