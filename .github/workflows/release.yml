name: Release

# Publishes a GitHub release (and creates the tag) whenever the version in
# manifest.json changes on main. Notes come from the matching "## vX.Y.Z"
# section of CHANGELOG.md.
on:
  push:
    branches: [main]
    paths:
      - custom_components/tapo_rv30/manifest.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "tag=v$(python3 -c 'import json; print(json.load(open("custom_components/tapo_rv30/manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          awk -v tag="$TAG" '$0 == "## " tag {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
