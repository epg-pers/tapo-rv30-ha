name: Feature request
description: Something the robot or the app can do that the integration does not yet
labels: ["enhancement"]
body:
  - type: input
    id: model
    attributes:
      label: Robot model and firmware
      placeholder: RV30 Max Plus, 1.3.3 Build 260206
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What it should do and how you would use it in Home Assistant.
    validations:
      required: true
  - type: textarea
    id: app
    attributes:
      label: How the Tapo app does it (optional)
      description: Where it lives in the app, and anything you know about the device call. Raw `send_raw` responses are gold.
