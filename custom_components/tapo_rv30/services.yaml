clean_rooms:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    rooms:
      required: true
      example:
      - Kitchen
      - Hallway
      selector:
        object: {}
    map:
      required: false
      example: Downstairs
      selector:
        text: {}
set_room_settings:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    rooms:
      required: true
      example:
      - Kitchen
      selector:
        object: {}
    suction:
      example: Turbo
      selector:
        select:
          options:
          - Quiet
          - Standard
          - Turbo
          - Max
          - Ultra
    water:
      example: low
      selector:
        select:
          options:
          - 'off'
          - low
          - medium
          - high
    passes:
      example: 1
      selector:
        number:
          min: 1
          max: 3
    map:
      selector:
        text: {}
clean_zone:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    zones:
      required: true
      example:
      - - -500
        - -500
        - 500
        - 500
      selector:
        object: {}
    suction:
      selector:
        select:
          options:
          - Quiet
          - Standard
          - Turbo
          - Max
          - Ultra
    water:
      selector:
        select:
          options:
          - 'off'
          - low
          - medium
          - high
    passes:
      selector:
        number:
          min: 1
          max: 3
run_schedule:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    schedule_id:
      required: true
      example: 1
      selector:
        text: {}
send_raw:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    method:
      required: true
      example: getCleanAttr
      selector:
        text: {}
    params:
      example: '{"type": "global"}'
      selector:
        object: {}
get_clean_records:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    limit:
      example: 10
      selector:
        number:
          min: 1
          max: 100
run_preset:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    preset:
      required: true
      example: Daytime Vacuum
      selector:
        text: {}
set_map:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    map:
      required: true
      example: Upstairs
      selector:
        text: {}

go_to:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    x:
      required: true
      example: -800
      selector:
        number:
          min: -20000
          max: 20000
          step: 10
          unit_of_measurement: mm
          mode: box
    y:
      required: true
      example: 1500
      selector:
        number:
          min: -20000
          max: 20000
          step: 10
          unit_of_measurement: mm
          mode: box
