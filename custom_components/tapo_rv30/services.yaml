clean_rooms:
  name: Clean specific rooms
  description: Send the vacuum to clean one or more named rooms.
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    rooms:
      name: Rooms
      description: List of room names to clean (partial match, case-insensitive).
      required: true
      example: ["Kitchen", "Hallway"]
      selector:
        object:
    map:
      name: Map
      description: Optional map name to search in (e.g. "Downstairs"). Defaults to current map.
      required: false
      example: "Downstairs"
      selector:
        text:

set_room_settings:
  name: Set room settings
  description: Per-room suction / water / passes (what the app calls custom cleaning settings).
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    rooms:
      name: Rooms
      required: true
      example: ["Kitchen"]
      selector:
        object:
    suction:
      name: Suction
      example: "Turbo"
      selector:
        select:
          options: ["Quiet", "Standard", "Turbo", "Max", "Ultra"]
    water:
      name: Water
      example: "low"
      selector:
        select:
          options: ["off", "low", "medium", "high"]
    passes:
      name: Passes
      example: 1
      selector:
        number:
          min: 1
          max: 3
    map:
      name: Map
      selector:
        text:

clean_zone:
  name: Clean zones
  description: >-
    Clean rectangles given as [x1, y1, x2, y2] in the map's real coordinates (mm, same
    frame as the vacuum's position_mm attribute). Starts the robot.
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    zones:
      name: Zones
      required: true
      example: [[-500, -500, 500, 500]]
      selector:
        object:
    suction:
      name: Suction
      selector:
        select:
          options: ["Quiet", "Standard", "Turbo", "Max", "Ultra"]
    water:
      name: Water
      selector:
        select:
          options: ["off", "low", "medium", "high"]
    passes:
      name: Passes
      selector:
        number:
          min: 1
          max: 3

run_schedule:
  name: Run a saved schedule now
  description: >-
    Start the clean a Tapo-app schedule would start, right now. The vacuum has
    no "run schedule" call, so this replays the schedule's rooms / preset,
    suction, water and passes. Get the id from the Schedules sensor's attributes.
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    schedule_id:
      name: Schedule ID
      required: true
      example: 1
      selector:
        text:

send_raw:
  name: Send raw command
  description: >-
    Send any device method (e.g. getCleanAttr) with optional params and return
    the response. For diagnostics and experimenting; writes can change settings.
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    method:
      name: Method
      required: true
      example: getCleanAttr
      selector:
        text:
    params:
      name: Params
      example: '{"type": "global"}'
      selector:
        object:
