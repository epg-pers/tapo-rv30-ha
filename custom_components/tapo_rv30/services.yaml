clean_rooms:
  target:
    entity:
      domain: vacuum
      integration: tapo_rv30
  fields:
    rooms:
      required: true
      example:
      - Kitchen
      - Hallway
      selector:
        object: {}
    map:
      required: false
      example: Downstairs
      selector:
        text: {}
    suction:
      example: Turbo
      selector:
        select:
          options:
          - Quiet
          - Standard
          - Turbo
          - Max
          - Ultra
    water:
      example: low
      selector:
        select:
          options:
          - 'off'
          - low
          - medium
          - high
    passes:
      example: 1
      selector:
        number:
          min: 1
          max: 3
